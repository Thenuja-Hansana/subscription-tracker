<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">How the Subscription Tracker API works</title>
  <desc id="desc">Every request passes from the client through Arcjet, the auth check and the Express routes to MongoDB. Every day at 09:00 UTC, Upstash Workflow calls the daily check, which reads the active subscriptions from MongoDB and sends reminder emails.</desc>

  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .eyebrow { font-size: 14px; font-weight: 600; letter-spacing: 2px; }
    .track { stroke: #334155; stroke-width: 2; }
    .arrow { fill: none; stroke: #64748b; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .box { fill: #1e293b; stroke: #334155; }
    .box-title { font-size: 18px; font-weight: 700; fill: #f8fafc; text-anchor: middle; }
    .box-note { font-size: 14px; fill: #94a3b8; text-anchor: middle; }

    /* A dot travels along each row, and each box lights up while the dot is inside it */
    .dot { animation: travel 4s linear infinite; }
    .lit { fill: none; stroke-width: 2; opacity: 0; animation: 4s linear infinite; }
    .lit-request { stroke: #38bdf8; animation-name: lit-request; }
    .lit-daily { stroke: #f59e0b; animation-name: lit-daily; }
    @keyframes travel {
      from { transform: translateX(0); }
      to { transform: translateX(1072px); }
    }
    @keyframes lit-request {
      0% { opacity: 0; }
      2% { opacity: 1; }
      17% { opacity: 1; }
      21% { opacity: 0; }
      100% { opacity: 0; }
    }
    @keyframes lit-daily {
      0% { opacity: 0; }
      2% { opacity: 1; }
      21% { opacity: 1; }
      25% { opacity: 0; }
      100% { opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .dot, .lit { animation: none; }
      .dot { display: none; }
    }
  </style>

  <rect x="1" y="1" width="1198" height="428" rx="24" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>

  <!-- Row 1: every request -->
  <text class="eyebrow" x="64" y="68" fill="#38bdf8">EVERY REQUEST</text>
  <line class="track" x1="64" y1="134" x2="1136" y2="134"/>
  <circle class="dot" cx="64" cy="134" r="6" fill="#38bdf8"/>
  <path class="arrow" d="M264 129 l6 5 l-6 5"/>
  <path class="arrow" d="M486 129 l6 5 l-6 5"/>
  <path class="arrow" d="M708 129 l6 5 l-6 5"/>
  <path class="arrow" d="M930 129 l6 5 l-6 5"/>

  <rect class="box" x="64" y="92" width="184" height="84" rx="14"/>
  <rect class="lit lit-request" x="64" y="92" width="184" height="84" rx="14"/>
  <text class="box-title" x="156" y="128">Client</text>
  <text class="box-note" x="156" y="152">sends a request</text>

  <rect class="box" x="286" y="92" width="184" height="84" rx="14"/>
  <rect class="lit lit-request" x="286" y="92" width="184" height="84" rx="14" style="animation-delay: 0.83s"/>
  <text class="box-title" x="378" y="128">Arcjet</text>
  <text class="box-note" x="378" y="152">rate limit · bots</text>

  <rect class="box" x="508" y="92" width="184" height="84" rx="14"/>
  <rect class="lit lit-request" x="508" y="92" width="184" height="84" rx="14" style="animation-delay: 1.66s"/>
  <text class="box-title" x="600" y="128">Auth</text>
  <text class="box-note" x="600" y="152">checks the JWT</text>

  <rect class="box" x="730" y="92" width="184" height="84" rx="14"/>
  <rect class="lit lit-request" x="730" y="92" width="184" height="84" rx="14" style="animation-delay: 2.49s"/>
  <text class="box-title" x="822" y="128">Routes</text>
  <text class="box-note" x="822" y="152">Express controllers</text>

  <rect class="box" x="952" y="92" width="184" height="84" rx="14"/>
  <rect class="lit lit-request" x="952" y="92" width="184" height="84" rx="14" style="animation-delay: 3.31s"/>
  <text class="box-title" x="1044" y="128">MongoDB</text>
  <text class="box-note" x="1044" y="152">users · subscriptions</text>

  <!-- Row 2: the daily check -->
  <text class="eyebrow" x="64" y="254" fill="#f59e0b">EVERY DAY AT 09:00 UTC</text>
  <line class="track" x1="64" y1="320" x2="1136" y2="320"/>
  <circle class="dot" cx="64" cy="320" r="6" fill="#f59e0b"/>
  <path class="arrow" d="M317 315 l6 5 l-6 5"/>
  <path class="arrow" d="M597 315 l6 5 l-6 5"/>
  <path class="arrow" d="M877 315 l6 5 l-6 5"/>

  <rect class="box" x="64" y="278" width="232" height="84" rx="14"/>
  <rect class="lit lit-daily" x="64" y="278" width="232" height="84" rx="14"/>
  <text class="box-title" x="180" y="314">Upstash Workflow</text>
  <text class="box-note" x="180" y="338">calls the API on a schedule</text>

  <rect class="box" x="344" y="278" width="232" height="84" rx="14"/>
  <rect class="lit lit-daily" x="344" y="278" width="232" height="84" rx="14" style="animation-delay: 1.04s"/>
  <text class="box-title" x="460" y="314">Daily check</text>
  <text class="box-note" x="460" y="338">finds renewals due soon</text>

  <rect class="box" x="624" y="278" width="232" height="84" rx="14"/>
  <rect class="lit lit-daily" x="624" y="278" width="232" height="84" rx="14" style="animation-delay: 2.09s"/>
  <text class="box-title" x="740" y="314">MongoDB</text>
  <text class="box-note" x="740" y="338">active subscriptions</text>

  <rect class="box" x="904" y="278" width="232" height="84" rx="14"/>
  <rect class="lit lit-daily" x="904" y="278" width="232" height="84" rx="14" style="animation-delay: 3.13s"/>
  <text class="box-title" x="1020" y="314">Email</text>
  <text class="box-note" x="1020" y="338">reminder to the owner</text>
</svg>
