<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 270" role="img" aria-labelledby="title desc">
  <title id="title">Reminder timeline</title>
  <desc id="desc">A reminder email is sent 7, 5, 2 and 1 days before a subscription renews. On the renewal day the renewal date moves forward to the next period.</desc>

  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .eyebrow { font-size: 14px; font-weight: 600; letter-spacing: 2px; fill: #f59e0b; }
    .heading { font-size: 20px; font-weight: 600; fill: #f8fafc; }
    .line { stroke: #334155; stroke-width: 4; stroke-linecap: round; }
    .marker { fill: #1e293b; stroke: #334155; stroke-width: 2; }
    .icon { fill: none; stroke: #cbd5e1; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .label { font-size: 15px; font-weight: 600; fill: #f8fafc; text-anchor: middle; }
    .note { font-size: 13px; fill: #94a3b8; text-anchor: middle; }

    /* The line fills from left to right, and each marker lights up as the line reaches it */
    .progress { stroke: #f59e0b; stroke-width: 4; stroke-linecap: round; stroke-dasharray: 900; stroke-dashoffset: 900; animation: fill 6s linear infinite; }
    .playhead { fill: #f59e0b; animation: move 6s linear infinite; }
    .flash { fill: #f59e0b; fill-opacity: 0.25; stroke: #f59e0b; stroke-width: 2; opacity: 0; animation: flash 6s linear infinite; }
    .flash-renewal { fill: #34d399; stroke: #34d399; }
    @keyframes fill {
      to { stroke-dashoffset: 0; }
    }
    @keyframes move {
      from { transform: translateX(0); }
      to { transform: translateX(900px); }
    }
    @keyframes flash {
      0% { opacity: 0; }
      3% { opacity: 1; }
      14% { opacity: 1; }
      22% { opacity: 0; }
      100% { opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .progress, .playhead, .flash { animation: none; }
      .progress { stroke-dashoffset: 0; }
      .playhead { display: none; }
      .flash { opacity: 1; }
    }
  </style>

  <rect x="1" y="1" width="1198" height="268" rx="24" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>

  <text class="eyebrow" x="64" y="62">REMINDERS</text>
  <text class="heading" x="64" y="94">An email goes out 7, 5, 2 and 1 days before a subscription renews</text>

  <line class="line" x1="150" y1="160" x2="1050" y2="160"/>
  <line class="progress" x1="150" y1="160" x2="1050" y2="160"/>
  <circle class="playhead" cx="150" cy="160" r="7"/>

  <!-- 7 days before -->
  <circle class="marker" cx="150" cy="160" r="22"/>
  <circle class="flash" cx="150" cy="160" r="22" style="animation-delay: 0s"/>
  <rect class="icon" x="139" y="152" width="22" height="16" rx="2"/>
  <polyline class="icon" points="139,153 150,162 161,153"/>
  <text class="label" x="150" y="208">7 days before</text>
  <text class="note" x="150" y="228">reminder email</text>

  <!-- 5 days before -->
  <circle class="marker" cx="407" cy="160" r="22"/>
  <circle class="flash" cx="407" cy="160" r="22" style="animation-delay: 1.71s"/>
  <rect class="icon" x="396" y="152" width="22" height="16" rx="2"/>
  <polyline class="icon" points="396,153 407,162 418,153"/>
  <text class="label" x="407" y="208">5 days before</text>
  <text class="note" x="407" y="228">reminder email</text>

  <!-- 2 days before -->
  <circle class="marker" cx="793" cy="160" r="22"/>
  <circle class="flash" cx="793" cy="160" r="22" style="animation-delay: 4.29s"/>
  <rect class="icon" x="782" y="152" width="22" height="16" rx="2"/>
  <polyline class="icon" points="782,153 793,162 804,153"/>
  <text class="label" x="793" y="208">2 days before</text>
  <text class="note" x="793" y="228">reminder email</text>

  <!-- 1 day before -->
  <circle class="marker" cx="921" cy="160" r="22"/>
  <circle class="flash" cx="921" cy="160" r="22" style="animation-delay: 5.14s"/>
  <rect class="icon" x="910" y="152" width="22" height="16" rx="2"/>
  <polyline class="icon" points="910,153 921,162 932,153"/>
  <text class="label" x="921" y="208">1 day before</text>
  <text class="note" x="921" y="228">reminder email</text>

  <!-- Renewal day -->
  <circle class="marker" cx="1050" cy="160" r="22"/>
  <circle class="flash flash-renewal" cx="1050" cy="160" r="22" style="animation-delay: 5.6s"/>
  <rect class="icon" x="1040" y="151" width="20" height="18" rx="3"/>
  <line class="icon" x1="1040" y1="157" x2="1060" y2="157"/>
  <line class="icon" x1="1045" y1="148" x2="1045" y2="153"/>
  <line class="icon" x1="1055" y1="148" x2="1055" y2="153"/>
  <text class="label" x="1050" y="208">Renewal day</text>
  <text class="note" x="1050" y="228">date moves forward</text>
</svg>
